[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "contentguard"
version = "1.0.0"
description = "OpenEnv environment for AI content moderation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.1",
    "pyyaml>=6.0.1",
    "openai>=1.30.1",
    "openenv-core>=0.2.0",
    "openenv>=0.2.0",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.uv]
dev-dependencies = []
